# Instale com: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c "cd backend && uv run mypy app"
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: lint-imports
        name: import-linter
        entry: bash -c "cd backend && uv run lint-imports"
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: prettier
        name: prettier
        entry: bash -c "cd frontend && pnpm exec prettier --write --ignore-unknown \"$@\"" --
        language: system
        files: ^frontend/src/

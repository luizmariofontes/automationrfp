# Ambiente local do piloto. Uso: `make up` (ver Makefile).
name: rfp-automation

x-backend: &backend
  build:
    context: ./backend
    args:
      UV_GROUPS: ""            # inclui dependências de desenvolvimento no ambiente local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://rfp:rfp@postgres:5432/rfp
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    # Pastas montadas do Windows não avisam mudanças ao container: o reload usa polling.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./backend:/app
    - /app/.venv
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.shared.celery_app worker -Q default -l info --concurrency 2

  cobranca:
    <<: *backend
    # Worker de cobrança (ADR-006) + agendador. Fila própria, processo próprio.
    command: celery -A app.shared.celery_app worker -Q cobranca -l info --concurrency 1 -B

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: rfp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rfp
      MINIO_ROOT_PASSWORD: rfp-secret-local
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    # Captura todos os e-mails enviados em desenvolvimento: http://localhost:8025
    image: axllent/mailpit:v1.20
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  miniodata:

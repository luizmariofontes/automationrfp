[project]
name = "rfp-automation"
version = "0.1.0"
description = "Automação de preenchimento de RFP/RFI com IA, RAG e biblioteca de respostas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "celery-types>=0.22",
    "httpx2>=2.16.0",
]

[tool.uv]
# Aplicação, não biblioteca: não empacota o projeto.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert é permitido nos testes

[tool.ruff.lint.per-file-ignores]
# S608: as migrações montam DDL com constantes do próprio arquivo.
"migrations/*" = ["N999", "E501", "S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: precisa de Postgres e Redis reais (make up)"]

# ---------------------------------------------------------------- import-linter
# Regras de camadas entre pacotes. A regra "um módulo só usa a interface pública
# de outro" é verificada em tests/test_arquitetura.py.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Módulos de negócio não dependem de adaptadores concretos"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.adapters"]

[[tool.importlinter.contracts]]
name = "Shared não depende de módulos nem de adaptadores"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules", "app.adapters"]

[[tool.importlinter.contracts]]
name = "Adaptadores não dependem de módulos de negócio"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.modules"]

# Camada "código" do isolamento do agente: ele não conhece clientes, requisições,
# conversas nem o cofre de correspondência. De uma requisição, só recebe `VisaoAgente`.
[[tool.importlinter.contracts]]
name = "O agente não importa módulos que guardam dados de clientes"
type = "forbidden"
source_modules = ["app.modules.motor_respostas"]
forbidden_modules = [
    "app.modules.cadastros",
    "app.modules.requisicoes",
    "app.modules.comunicacao",
    "app.modules.privacidade",
]
